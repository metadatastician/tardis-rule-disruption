name: Secret Scanner

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  secret-scan:
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@1acabd27e4517fd690b73815de25ae8806c942f0
