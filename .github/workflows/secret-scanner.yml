# SPDX-License-Identifier: MPL-2.0
name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# Shape matches the reusable's documented canonical caller (standards#500):
# `contents: read` is the WHOLE permission requirement — granting extras a
# reusable job does not request is how callers get startup-rejected.
# `secrets: inherit` is REQUIRED — without it the inner gitleaks GITHUB_TOKEN
# is empty and the scan silently degrades (a fail-open gate).
jobs:
  scan:
    permissions:
      contents: read
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@1acabd27e4517fd690b73815de25ae8806c942f0
    secrets: inherit
